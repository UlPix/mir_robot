services:
  ros2-gazebo:
    build:
      context: .
      args:
        GZ_VERSION: "harmonic"
    container_name: ros2-humble-gazebo
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/mir_robot:/ws/mir_robot
    devices:
     - /dev/dri
    network_mode: "host"   
    stdin_open: true      
    tty: true             
